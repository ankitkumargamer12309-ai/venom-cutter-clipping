
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Venom Cutter</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#050705;color:white;
 font-family:Arial,sans-serif;display:flex;
 align-items:center;justify-content:center;padding:20px;
}
.card{
 width:100%;max-width:430px;background:#101510;
 border:1px solid #263326;border-radius:18px;
 padding:38px 28px;text-align:center;
 box-shadow:0 0 45px #39ff1418;
}
.logo{font-size:34px;font-weight:900;letter-spacing:2px}
.logo span{color:#55ff36}
.tag{color:#9aa69a;font-size:13px;letter-spacing:2px;margin:12px 0 35px}
h2{font-size:25px;margin-bottom:10px}
.desc{color:#9aa69a;font-size:14px;line-height:1.6}
.google{
 width:100%;padding:15px;margin-top:28px;
 background:#55ff36;color:#061006;border:0;
 border-radius:7px;font-weight:900;font-size:15px;
 cursor:pointer;
}
.google:hover{background:#78ff60}
.note{font-size:12px;color:#9aa69a;line-height:1.6;margin-top:16px}
.back{display:inline-block;margin-top:28px;color:#55ff36;
 text-decoration:none;font-size:13px}
footer{margin-top:35px;color:#758175;font-size:12px}
footer span{color:#55ff36}
</style>
</head>
<body>
<div class="card">
 <div class="logo">VENOM <span>CUTTER</span></div>
 <div class="tag">CLIPPING PLATFORM</div>

 <h2>WELCOME BACK</h2>
 <p class="desc">
 Sign in to access your personal AI clipping studio.
 </p>

 <button class="google" id="googleSignIn" type="button">
 Continue with Google
 </button>

 <p class="note">
 Firebase Google sign-in. Add your Firebase web-app config and enable Google provider to activate.
 </p>
 <p class="note" id="loginStatus" role="status" aria-live="polite"></p>

 <a class="back" href="index.html">← BACK TO HOME</a>
 <footer>MADE BY <span>@halcyon_011</span></footer>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Replace these values with the Firebase Web App config from Project settings.
const firebaseConfig = {
  apiKey: "AIzaSyAAzq482lfExO79Hweyk311FLhFO5OBoPM",
  authDomain: "venom-cutter-clipping.firebaseapp.com",
  projectId: "venom-cutter-clipping",
  storageBucket: "venom-cutter-clipping.firebasestorage.app",
  messagingSenderId: "276664842889",
  appId: "1:276664842889:web:8a199d3ac237e80011a458",
  measurementId: "G-7YCET47EJL"
};

const button = document.getElementById("googleSignIn");
const status = document.getElementById("loginStatus");
const isConfigured = Object.values(firebaseConfig).every((value) => value && !value.startsWith("PASTE_"));

button.addEventListener("click", async () => {
  if (!isConfigured) {
    status.textContent = "Firebase setup needed: add your Web App config first."; 
    return;
  }
  button.disabled = true;
  status.textContent = "Opening Google sign-in…";
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    status.textContent = "Signed in. Opening clipping studio…";
    window.location.href = "clipping.html";
  } catch (error) {
    status.textContent = error.message || "Google sign-in failed. Check Firebase settings."; 
    button.disabled = false;
  }
});
</script>
</body>
</html>
